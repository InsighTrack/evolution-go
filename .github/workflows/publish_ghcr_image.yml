name: Build and Publish Docker Image (GHCR)

# Imagem do fork InsighTrack: Evolution Go na tag 0.7.2 com whatsmeow atualizado.
# Publica ghcr.io/insightrack/evolution-go:<VERSION>-wm-<AAAAMMDD> (data UTC do build).

on:
  push:
    branches:
      - claude/evolution-go-whatsapp-update-id0p9a
  workflow_dispatch:

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_push:
    name: Build and Push (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: version
        run: |
          version="$(cat VERSION 2>/dev/null || echo '0.0.0')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${version}-wm-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/insightrack/evolution-go
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Summary
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo "- Tag: \`${{ steps.meta.outputs.tags }}\`"
            echo "- Digest: \`${{ steps.docker_build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
