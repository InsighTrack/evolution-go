version: "3.8"

# Stack de TESTE do Evolution Go (InsighTrack), derivado do stack de produção.
# Isolado da produção: bancos *_test, volumes *_test, router/service Traefik *_test,
# subdomínio evolutiongo-test. Mesma rede e mesmo padrão de labels do Traefik.
# Senhas/chaves são placeholders: preencha antes do deploy e NÃO commite os valores reais.

services:
  evolution_go_test:
    image: ghcr.io/insightrack/evolution-go:0.7.2-wm-20260929
    networks:
      - network_swarm_public
    environment:
      SERVER_PORT: 4000
      CLIENT_NAME: "evolution"
      GLOBAL_API_KEY: "TROCAR_GLOBAL_API_KEY_TESTE"

      POSTGRES_AUTH_DB: "postgresql://evogo_rw:SENHA_AQUI@postgres:5432/evogo_auth_test?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://evogo_rw:SENHA_AQUI@postgres:5432/evogo_users_test?sslmode=disable"

      DATABASE_SAVE_MESSAGES: "false"
      REDIS_URL: "redis://redis:6379"
      WADEBUG: "INFO"
      LOGTYPE: "console"
      LOG_DIRECTORY: "/app/logs"
      LOG_MAX_SIZE: "100"
      LOG_MAX_BACKUPS: "5"
      LOG_MAX_AGE: "30"
      LOG_COMPRESS: "true"
      CONNECT_ON_STARTUP: "true"
      QRCODE_MAX_COUNT: "50"
      WEBHOOK_FILES: "true"
      OS_NAME: "Linux"
      API_AUDIO_CONVERTER: ""
      API_AUDIO_CONVERTER_KEY: ""
      PROXY_HOST: ""
      PROXY_PORT: ""
      PROXY_USERNAME: ""
      PROXY_PASSWORD: ""
      AMQP_URL: ""
      AMQP_GLOBAL_ENABLED: "false"
      AMQP_GLOBAL_EVENTS: ""
      NATS_URL: ""
      NATS_GLOBAL_ENABLED: "false"
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"
      MINIO_ENABLED: "false"
      MINIO_ENDPOINT: ""
      MINIO_ACCESS_KEY: ""
      MINIO_SECRET_KEY: ""
      MINIO_BUCKET: ""
      MINIO_USE_SSL: "false"
    volumes:
      - evolution_go_test_data:/app/dbdata
      - evolution_go_test_logs:/app/logs
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == manager-tracklabs-1
      restart_policy:
        condition: on-failure
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.http.routers.evolution_go_test.rule=Host(`evolutiongo-test.tracklabs.com.br`)
        - traefik.http.routers.evolution_go_test.entrypoints=websecure
        - traefik.http.routers.evolution_go_test.tls=true
        - traefik.http.routers.evolution_go_test.tls.certresolver=letsencryptresolver
        - traefik.http.routers.evolution_go_test.service=evolution_go_test
        - traefik.http.services.evolution_go_test.loadbalancer.server.port=4000
        - traefik.http.services.evolution_go_test.loadbalancer.passHostHeader=true

volumes:
  evolution_go_test_data:
    name: evolution_go_test_data
  evolution_go_test_logs:
    name: evolution_go_test_logs

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
